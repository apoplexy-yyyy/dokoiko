<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>どこいこ</title>
    <meta name="description" content="今日、子供とどこに行こう？ 近所の知らなかったお出かけ先を偶然発見する地図。" />
    <meta name="theme-color" content="#f6efe3" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e8743b'/%3E%3Cpath d='M32 14l6 14 14 4-14 4-6 14-6-14-14-4 14-4z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <h1 class="brand-name">どこいこ <span class="ver" id="ver"></span></h1>
          <p class="brand-sub">いつもの週末に、新しい発見を。<span class="edition">神奈川試作版</span></p>
          <div class="brand-actions">
            <span class="when-label">🗓️<span> イベント</span></span>
            <div class="seg" id="when" role="group" aria-label="イベントの時期"></div>
            <button class="ghost-btn icon-btn" id="open-viewed" type="button" aria-label="閲覧履歴" title="閲覧履歴">🕘</button>
            <button class="ghost-btn icon-btn" id="open-about" type="button" aria-label="このサイトについて・出典">ⓘ</button>
          </div>
        </div>
        <p class="status" id="status" role="status"></p>
      </header>

      <main class="map-wrap" aria-label="地図">
        <div id="map"></div>
        <details class="legend" id="legend" open>
          <summary>表示する種類</summary>
          <div class="legend-all">
            <button type="button" id="all-on">すべてオン</button>
            <button type="button" id="all-off">すべてオフ</button>
          </div>
          <div class="kinds" id="kinds" role="group" aria-label="表示する種類"></div>
          <label class="legend-base">地図の種類
            <select id="base" aria-label="地図の種類"></select>
          </label>
          <p class="legend-note">大きく濃いアイコンほどおすすめ。押すと詳しい情報が出ます。</p>
        </details>
      </main>
    </div>

    <dialog id="viewed" class="log">
      <form method="dialog" class="log-head">
        <h2>閲覧履歴</h2>
        <span class="log-head-actions">
          <button class="ghost-btn" type="button" id="viewed-clear">すべて消す</button>
          <button class="ghost-btn" value="close" aria-label="閉じる">✕</button>
        </span>
      </form>
      <ul id="viewed-list" class="log-list"></ul>
    </dialog>

    <dialog id="about" class="log">
      <form method="dialog" class="log-head">
        <h2>どこいこについて</h2>
        <button class="ghost-btn" value="close" aria-label="閉じる">✕</button>
      </form>
      <p>近所にあるのに知らなかった、子供と行ける場所やイベントを、地図から偶然見つけるためのサイトです。いまは神奈川県だけを対象にした試作版です。アイコンを押すと詳しい情報が出ます。</p>
      <p id="updated"></p>
      <p class="sources" id="sources"></p>
      <p class="sources">背景地図：<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>、航空写真 <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル（国土地理院）</a></p>
    </dialog>


    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
