<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>どこいこ</title>
    <meta name="description" content="今日、子供とどこに行こう？ 近所の知らなかったお出かけ先を偶然発見する地図。" />
    <meta name="theme-color" content="#f6efe3" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e8743b'/%3E%3Cpath d='M32 14l6 14 14 4-14 4-6 14-6-14-14-4 14-4z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <div class="brand-text">
            <h1 class="brand-name">どこいこ <span class="ver" id="ver"></span></h1>
            <p class="brand-sub">今日、子供とどこに行こう？ 地図を動かすと、その範囲の子供向けイベントと行ける場所が出てきます。</p>
          </div>
          <div class="brand-actions">
            <button class="ghost-btn" id="open-log" type="button">きろく <span id="log-count" class="badge">0</span></button>
            <button class="ghost-btn icon-btn" id="open-about" type="button" aria-label="このサイトについて・出典">ⓘ</button>
          </div>
        </div>
        <div class="tools">
          <button class="chip-btn" id="locate" type="button">📍 現在地へ</button>
          <select id="city" aria-label="市区町村へ移動">
            <option value="">市区町村へ移動</option>
          </select>
          <label class="toggle">
            <input type="checkbox" id="rainy" />
            <span>☔ 雨の日（屋内だけ）</span>
          </label>
          <div class="seg" id="when" role="group" aria-label="イベントの日付"></div>
        </div>
        <p class="status" id="status" role="status"></p>
      </header>

      <main class="map-wrap" aria-label="地図">
        <div id="map"></div>
        <details class="legend" id="legend" open>
          <summary>表示する種類</summary>
          <div class="legend-all">
            <button type="button" id="all-on">すべてオン</button>
            <button type="button" id="all-off">すべてオフ</button>
          </div>
          <div class="kinds" id="kinds" role="group" aria-label="表示する種類"></div>
          <p class="legend-note">大きく濃いアイコンほどおすすめ。<span class="dot dot-found"></span>これまでに見た場所 <span id="found-count">0</span></p>
        </details>
        <div class="area-info" id="area-info" aria-live="polite"></div>
      </main>
    </div>

    <dialog id="about" class="log">
      <form method="dialog" class="log-head">
        <h2>どこいこについて</h2>
        <button class="ghost-btn" value="close" aria-label="閉じる">✕</button>
      </form>
      <p>近所にあるのに知らなかった、子供と行ける場所やイベントを、地図から偶然見つけるためのサイトです。アイコンを押すと詳しい情報が出ます。</p>
      <p id="updated"></p>
      <p class="sources" id="sources"></p>
    </dialog>

    <dialog id="log" class="log">
      <form method="dialog" class="log-head">
        <h2>きろく</h2>
        <button class="ghost-btn" value="close" aria-label="閉じる">✕</button>
      </form>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="want" aria-selected="true">⭐ 行ってみたい</button>
        <button role="tab" data-tab="went">✅ 行った</button>
        <button role="tab" data-tab="seen">✦ 見た場所</button>
      </div>
      <ul id="log-list" class="log-list"></ul>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
