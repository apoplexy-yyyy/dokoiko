name: データ収集（週次）

on:
  schedule:
    - cron: '0 18 * * 5' # 毎週土曜 03:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: HTTPキャッシュ
        uses: actions/cache@v4
        with:
          path: .cache
          key: http-${{ github.run_id }}
          restore-keys: http-
      - name: 収集・統合
        run: npm run collect
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "データに変更なし"
          else
            git commit -m "data: 週次更新 $(date -u +%Y-%m-%d)"
            git push
          fi
